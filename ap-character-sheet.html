/* ============================================================ ACTIONS ============================================================ */
function buy(id){const it=findItem(id);if(!it)return;const count=S.bought[id]||0;if(isLocked(id)||isMaxed(it,count))return;const next=costOfRank(it,count);if(availableAp()<next){toast("Not enough AP.");return;}const sel=SELECTORS[id];if(sel){pickTarget(it.name,sel.type,id,(choice)=>{if(!choice)return;S.bought[id]=count+1;(S.choices[id]=S.choices[id]||[]).push(choice);afterChange();});}else{S.bought[id]=count+1;afterChange();}}
function sell(id){const count=S.bought[id]||0;if(count<=0)return;S.bought[id]=count-1;if(S.choices[id]&&S.choices[id].length)S.choices[id].pop();if(S.bought[id]===0)delete S.bought[id];cascadeUnlock();afterChange();}
function cascadeUnlock(){let changed=true;while(changed){changed=false;for(const dep in PREREQS){const req=PREREQS[dep];if((S.bought[req]||0)===0&&(S.bought[dep]||0)>0){delete S.bought[dep];if(S.choices[dep])delete S.choices[dep];changed=true;}}}}
function afterChange(){save();renderHeader();renderShop();renderOverview();renderAttrs();renderLevel();}
function setAbility(k,val){val=Math.round(val);if(isNaN(val))val=10;if(val<6)val=6;if(val>18)val=18;const others=Object.keys(S.abilities).filter(x=>x!==k).reduce((a,x)=>a+S.abilities[x],0);if(others+val>72){val=72-others;if(val<6){toast("Point-buy budget (72) reached.");renderAttrs();return;}}S.abilities[k]=val;save();renderAttrs();renderOverview();renderLevel();}
function toggleSkill(k,on){if(on){if(!S.selectedSkills.includes(k))S.selectedSkills.push(k);}else S.selectedSkills=S.selectedSkills.filter(x=>x!==k);save();renderAttrs();renderOverview();}
function toggleProf(id,on){if(on){if(!S.selectedProfs.includes(id))S.selectedProfs.push(id);}else{S.selectedProfs=S.selectedProfs.filter(x=>x!==id);if(id==="lgt")S.selectedProfs=S.selectedProfs.filter(x=>x!=="med"&&x!=="hvy");if(id==="med")S.selectedProfs=S.selectedProfs.filter(x=>x!=="hvy");if(id==="sim")S.selectedProfs=S.selectedProfs.filter(x=>x!=="mar");}save();renderAttrs();renderOverview();}

function optionsFor(type){if(type==="ability")return ABILITIES;if(type==="skill"){const o={};Object.keys(SKILLS).forEach(k=>o[k]=SKILLS[k].l);return o;}if(type==="damage"){if(S.mode==="turm"){const o={};Object.keys(ELEMENTS).forEach(k=>o[k]=ELEMENTS[k].l);return o;}return DAMAGE_TYPES;}if(type==="creature")return CREATURE_TYPES;if(type==="fightStyle")return FIGHT_STYLES;if(type==="weapon")return WEAPONS;return {};}
function pickTarget(title,type,id,cb){
  const opts=optionsFor(type);
  const sel=`<select id="m-sel">${Object.entries(opts).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}<option value="__custom__">Custom / other…</option></select>`;
  openModal(`<h3>${title}</h3><label>${SELECTORS[id]?.label||"Choose"}</label>${sel}
    <div id="m-custom-wrap" style="display:none"><label>Custom name</label><input type="text" id="m-custom" placeholder="e.g. Close Quarters Shooter"></div>
    <div class="modal-acts"><button class="m-cancel" id="m-x">Cancel</button><button class="m-ok" id="m-ok">Apply</button></div>`);
  const selEl=document.getElementById("m-sel");
  selEl.onchange=()=>{const c=selEl.value==="__custom__";document.getElementById("m-custom-wrap").style.display=c?"block":"none";if(c)setTimeout(()=>document.getElementById("m-custom").focus(),30);};
  document.getElementById("m-x").onclick=()=>{closeModal();cb(null);};
  document.getElementById("m-ok").onclick=()=>{
    let v=selEl.value;
    if(v==="__custom__"){v=document.getElementById("m-custom").value.trim();if(!v){toast("Please enter a name.");return;}}
    closeModal();cb(v);
  };
}
function milestoneStats(index){const rows=Object.keys(ABILITIES).map(k=>`<div class="ms-stat"><span>${ABILITIES[k]}</span><input type="number" class="ms-pt" data-k="${k}" value="0" min="0" max="2"></div>`).join("");openModal(`<h3>Milestone #${index} — Stats</h3><p style="font-size:13px;margin:0 0 6px">Assign exactly <span class="pts">2</span> points.</p>${rows}<div class="modal-acts"><button class="m-cancel" id="m-x">Cancel</button><button class="m-ok" id="m-ok">Apply</button></div>`);document.getElementById("m-x").onclick=closeModal;document.getElementById("m-ok").onclick=()=>{const stats={};let tot=0;document.querySelectorAll(".ms-pt").forEach(i=>{const v=Math.max(0,Math.min(2,+i.value||0));if(v>0)stats[i.dataset.k]=v;tot+=v;});if(tot!==2){toast("Must be exactly 2 points.");return;}S.milestones[index]={type:"asi",stats};closeModal();save();renderLevel();renderOverview();renderAttrs();};}
function milestoneFeat(index){openModal(`<h3>Milestone #${index} — Feat</h3><label>Feat name</label><input type="text" id="m-feat" placeholder="e.g. Sentinel"><div class="modal-acts"><button class="m-cancel" id="m-x">Cancel</button><button class="m-ok" id="m-ok">Apply</button></div>`);document.getElementById("m-x").onclick=closeModal;setTimeout(()=>document.getElementById("m-feat").focus(),50);document.getElementById("m-ok").onclick=()=>{const n=document.getElementById("m-feat").value.trim();if(!n){toast("Please enter a name.");return;}S.milestones[index]={type:"feat",name:n};if(!S.feats.some(f=>f.name===n))S.feats.push(Object.assign(newFeat(n),{src:"Milestone #"+index}));closeModal();save();renderLevel();renderOverview();toast(n+" added to Feats — edit it there to add stat bonuses (e.g. +1 STR).");};}

  const dtOpts=(S.mode==="turm"
    ? ((ELEMENTS[w.dtype]?"":`<option value="${w.dtype}" selected>${w.dtype}</option>`)+Object.keys(ELEMENTS).map(k=>`<option value="${k}" ${w.dtype===k?"selected":""}>${ELEMENTS[k].l}</option>`).join(""))
    : ((DMG_SHORT[w.dtype]?"":`<option value="${w.dtype}" selected>${ELEMENTS[w.dtype]?ELEMENTS[w.dtype].l:w.dtype}</option>`)+Object.keys(DMG_SHORT).map(k=>`<option value="${k}" ${w.dtype===k?"selected":""}>${DAMAGE_TYPES[k]||k}</option>`).join("")));
  openModal(`<h3>Edit Weapon</h3>
    <label>Name</label><input type="text" id="w-name" value="${escapeHtml(w.name)}">
    <label>Damage dice</label><input type="text" id="w-dice" value="${escapeHtml(w.dice)}" placeholder="1d8 / 2d6 / 1d10">
    <label>Damage type</label><select id="w-dtype">${dtOpts}</select>
    <label>Notes / special effects</label><textarea id="w-notes" class="ta" style="min-height:52px" placeholder="z. B. bei Crit: Ziel brennt…">${escapeHtml(w.notes||"")}</textarea>
    <label>Attack ability</label><select id="w-abil">${abilOpts}</select>
    <label>Magic bonus (+X)</label><input type="text" id="w-bonus" value="${Number(w.bonus)||0}">
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px"><input type="checkbox" id="w-prof" ${w.prof?"checked":""} style="width:16px;height:16px"> Proficient (adds +${derived().pb})</label>
    <div class="modal-acts"><button class="m-cancel" id="w-del" style="margin-right:auto;color:var(--red-br);border-color:var(--red-br)">Delete</button><button class="m-cancel" id="m-x">Cancel</button><button class="m-ok" id="m-ok">Save</button></div>`);
  document.getElementById("m-x").onclick=closeModal;
  document.getElementById("w-del").onclick=()=>{S.weapons=S.weapons.filter(x=>x.id!==id);closeModal();save();renderOverview();toast("Weapon deleted.");};
  document.getElementById("m-ok").onclick=()=>{
    w.name=document.getElementById("w-name").value.trim()||"Weapon";
    w.dice=document.getElementById("w-dice").value.trim();
    w.dtype=document.getElementById("w-dtype").value;
    w.notes=(document.getElementById("w-notes").value||"").trim();
    w.abil=document.getElementById("w-abil").value;
    w.bonus=parseInt(document.getElementById("w-bonus").value)||0;
    w.prof=document.getElementById("w-prof").checked;
    closeModal();save();renderOverview();
  };
}
function openModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modalBg").classList.add("show");}
function closeModal(){document.getElementById("modalBg").classList.remove("show");}
document.getElementById("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200);}

/* ----- Theme / PDF / Export / Import / Reset / Tabs / Header ----- */
document.getElementById("themeSel").onchange=(e)=>{applyTheme(e.target.value);save();};
document.getElementById("modeSel").onchange=(e)=>{S.mode=e.target.value;save();renderAll();toast(S.mode==="turm"?"Turm mode: spell points, carry limit, crystal circlet.":"Standard AP mode.");};
document.getElementById("btnPdf").onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelector('.tab[data-tab="overview"]').classList.add("active");
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  document.getElementById("panel-overview").classList.add("active");
  toast("Tip: choose 'Save as PDF' and enable background graphics.");
  setTimeout(()=>window.print(),350);
};
document.getElementById("btnExport").onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const a=document.createElement("a");const safe=(S.name||"character").replace(/[^\w\-]+/g,"_").toLowerCase();a.href=URL.createObjectURL(blob);a.download=`ap_${safe}.json`;a.click();URL.revokeObjectURL(a.href);toast("Character exported.");};
document.getElementById("btnImport").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(String(r.result).replace(/^\uFEFF/,"").trim());S=Object.assign(DEFAULTS(),data);S.identity=Object.assign(DEFAULTS().identity,S.identity||{});S.play=Object.assign(DEFAULTS().play,S.play||{});S.currency=Object.assign(DEFAULTS().currency,S.currency||{});if(!Array.isArray(S.weapons))S.weapons=[];if(!Array.isArray(S.spells))S.spells=[];if(!S.slotsUsed)S.slotsUsed={};if(!Array.isArray(S.feats))S.feats=[];if(!Array.isArray(S.items))S.items=[];if(!Array.isArray(S.crystals))S.crystals=[];if(!Array.isArray(S.turmwissen))S.turmwissen=[];if(!S.mode)S.mode="ap";if(!S.armor||!ARMORS[S.armor.id])S.armor={id:"none",shield:false};migrateWeapons();migrateFeats();migrateInsp();migrateItems();migrateCrystals();applyTheme(S.theme||"celestial");save();renderAll();toast("Character loaded.");}catch(err){toast("Could not read file: "+(err&&err.message?err.message:"invalid JSON"));}};r.readAsText(f);e.target.value="";};
document.getElementById("btnReset").onclick=()=>{openModal(`<h3>Reset character?</h3><p style="font-size:13.5px">All values, purchases and HP will be cleared. Export first if you want to keep this character.</p><div class="modal-acts"><button class="m-cancel" id="m-x">Cancel</button><button class="m-ok" id="m-ok" style="background:var(--red-br);border-color:var(--red-br);color:#fff">Reset</button></div>`);document.getElementById("m-x").onclick=closeModal;document.getElementById("m-ok").onclick=()=>{const th=S.theme;S=DEFAULTS();S.theme=th;applyTheme(th);save();closeModal();renderAll();toast("Reset done.");};};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));t.classList.add("active");document.getElementById("panel-"+t.dataset.tab).classList.add("active");});
document.getElementById("startAp").onchange=(e)=>{S.startAp=parseInt(e.target.value)||0;save();renderHeader();renderOverview();};
document.getElementById("earnedAp").onchange=(e)=>{S.earnedAp=parseInt(e.target.value)||0;save();renderAll();};
document.getElementById("addProf").onclick=()=>{const v=document.getElementById("newProf").value.trim();if(!v)return;S.customProfs.push(v);document.getElementById("newProf").value="";save();renderAttrs();renderOverview();};
document.getElementById("newProf").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("addProf").click();});

/* ---------- INIT ---------- */
load();
applyTheme(S.theme||"celestial");
renderAll();
</script>
</body>
</html>
